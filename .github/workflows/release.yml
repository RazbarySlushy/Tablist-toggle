name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
        # Newer Minecraft (26.x) compiles with Java 25, auto-provisioned by the Gradle
        # toolchain (foojay); older versions emit their release from the JDK 21 daemon.

      - name: Collect mod jars
        run: |
          mkdir -p release
          find versions/*/build/libs -type f -name 'tablisttoggle-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} release/ \;
          ls -l release

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: release/*.jar
